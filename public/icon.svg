<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">Invoicer app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="0.55" stop-color="#3B3FC9"/><stop offset="1" stop-color="#1E2A78"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0B1240" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- Invoice sheet -->
    <g filter="url(#shadow)">
      <path fill="#FFFFFF" d="M304 136 H622 L792 306 V816 A72 72 0 0 1 720 888 H304 A72 72 0 0 1 232 816 V208 A72 72 0 0 1 304 136 Z"/>
    </g>
    <path d="M622 136 V250 A56 56 0 0 0 678 306 H792 Z" fill="#C7D2FE"/>

    <g stroke-linecap="round" fill="none">
      <!-- Title -->
      <line x1="300" y1="240" x2="468" y2="240" stroke="#334155" stroke-width="48"/>
      <!-- Line items: description + amount -->
      <g stroke="#CBD5E1" stroke-width="44">
        <line x1="300" y1="380" x2="476" y2="380"/>
        <line x1="612" y1="380" x2="708" y2="380"/>
        <line x1="300" y1="472" x2="436" y2="472"/>
        <line x1="612" y1="472" x2="708" y2="472"/>
        <line x1="300" y1="564" x2="500" y2="564"/>
        <line x1="612" y1="564" x2="708" y2="564"/>
      </g>
    </g>

    <!-- Total, marked with a highlighter stroke -->
    <g transform="rotate(-3 512 752)">
      <rect x="264" y="690" width="496" height="124" rx="40" fill="#34D399"/>
      <g stroke-linecap="round" fill="none">
        <line x1="316" y1="752" x2="412" y2="752" stroke="#065F46" stroke-opacity="0.55" stroke-width="40"/>
        <line x1="556" y1="752" x2="708" y2="752" stroke="#064E3B" stroke-width="52"/>
      </g>
    </g>
  </g>
</svg>
